<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independence Day AR Filter & Reel Maker</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: min(90vw, 400px);
      height: min(80vh, 710px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 153, 51, 0.4), 0 0 60px rgba(19, 136, 8, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: #000;
    }

    video { display: none; }
    
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
    }

    .reel-badge {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 1px;
      z-index: 10;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    button {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-record {
      background: linear-gradient(45deg, #FF9933, #FF5722);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.5);
    }
    .btn-record.recording {
      background: #ff0055;
      animation: pulse 1s infinite alternate;
    }

    .btn-snap {
      background: rgba(255, 255, 255, 0.9);
      color: #111;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="reel-badge">🇮🇳 15 AUG LIVE AR REEL</div>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div class="controls">
      <button class="btn-snap" id="snapBtn">📸 Photo Snap</button>
      <button class="btn-record" id="recordBtn">🎥 Record Reel</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn');
    const snapBtn = document.getElementById('snapBtn');

    canvas.width = 720;
    canvas.height = 1280;

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    // MediaPipe FaceMesh Setup
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: 720,
      height: 1280
    });
    camera.start();

    // Draw Flag Paint on Cheeks
    function drawTricolor(ctx, pt, size) {
      const h = size / 3;
      const w = size * 1.5;

      // Saffron
      ctx.fillStyle = '#FF9933';
      ctx.fillRect(pt.x - w/2, pt.y - size/2, w, h);

      // White
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(pt.x - w/2, pt.y - size/2 + h, w, h);

      // Green
      ctx.fillStyle = '#138808';
      ctx.fillRect(pt.x - w/2, pt.y - size/2 + h*2, w, h);

      // Ashoka Chakra dot
      ctx.fillStyle = '#000080';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, h/3, 0, Math.PI * 2);
      ctx.fill();
    }

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Left & Right Cheek Landmarks
        const leftCheek = { x: landmarks[234].x * canvas.width, y: landmarks[234].y * canvas.height };
        const rightCheek = { x: landmarks[454].x * canvas.width, y: landmarks[454].y * canvas.height };

        // Draw AR Cheek Flags
        drawTricolor(ctx, leftCheek, 45);
        drawTricolor(ctx, rightCheek, 45);
      }

      // Reel Overlay Borders & Independence Day Branding
      ctx.strokeStyle = '#FF9933';
      ctx.lineWidth = 14;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      // Footer Banner
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, canvas.height - 180, canvas.width, 180);

      ctx.font = 'bold 44px sans-serif';
      ctx.fillStyle = '#FF9933';
      ctx.textAlign = 'center';
      ctx.fillText('VANDE MATARAM', canvas.width / 2, canvas.height - 110);

      ctx.font = '28px sans-serif';
      ctx.fillStyle = '#138808';
      ctx.fillText('HAPPY INDEPENDENCE DAY', canvas.width / 2, canvas.height - 60);

      ctx.restore();
    }

    // Photo Snapshot
    snapBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'independence-day-snap.png';
      link.href = canvas.toDataURL();
      link.click();
    });

    // 1-Click Video / Reel Recording
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        const stream = canvas.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'independence-day-reel.webm';
          a.click();
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.innerText = '⏹ Stop & Download';
        recordBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = '🎥 Record Reel';
        recordBtn.classList.remove('recording');
      }
    });
  </script>
</body>
</html>
